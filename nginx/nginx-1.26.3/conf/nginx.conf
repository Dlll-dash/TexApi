
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

	upstream webservers{
	  server 127.0.0.1:8081 weight=90 ;
	  #server 127.0.0.1:8088 weight=10 ;
	}

    server {
        listen       80;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            root   D:/TexApi/nginx/nginx-1.26.3/html/tex;
            index  index.html index.htm;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
	#反向代理配置，代理请求时自动去除前缀/api，实现统一代理所有后端接口
	location /tex/{
		proxy_pass   http://localhost:8080;
	# 新增跨域请求头（关键）
    	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header Origin $http_origin; # 传递前端 Origin
    
   	 # 允许跨域的核心配置
    	add_header Access-Control-Allow-Origin $http_origin; # 动态允许来源
   	add_header Access-Control-Allow-Credentials true; # 允许携带 Cookie
    	add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS'; # 允许的方法
    	add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With'; # 允许的请求头
    
    	# 拦截 OPTIONS 预检请求，直接返回 204（避免转发到后端）
    	if ($request_method = 'OPTIONS') {
        	return 204;
    	}
}
