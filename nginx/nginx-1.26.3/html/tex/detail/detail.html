<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon .ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
    /* 全局重置 */
        *:not(pre):not(pre *){
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        /* 页面背景（和主页一致） */
        body {
            background-color: #f5f7fa;
            padding: 2rem 1rem;
            display: flex;
            gap: 1.5rem; /* 左侧列表和右侧区域的间距 */
            height: 100vh; /* 固定视口高度 */
            overflow: hidden; /* 禁止body层级滚动 */
        }
        /* 左侧接口列表容器（占1/4宽度） */
        .api-list-title {

            color: #2d3748;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid #e8e8e8;
            text-align: center; 
        }
        #apiList {
            width: 25%; /* 核心：1/4宽度 */
            min-width: 280px; /* 最小宽度，避免小屏太窄 */
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 1.5rem;
            overflow-y: auto; /* 内容过多时独立滚动 */
            max-height: calc(100vh - 4rem); /* 减去body上下padding */
        }

        /* 右侧测试窗口容器（占3/4宽度） */
        #testWindow {
            flex: 1; /* 自动占剩余3/4宽度 */
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 1.5rem;
            min-height: 600px; /* 基础高度 */
            display: flex;
            flex-direction: column;
            overflow-y:scroll;
        }

        /* 子窗口容器 */
        #subWindow {
            flex: 1;
            margin-top: 1rem;
            overflow-y: auto;
        }

        /* 标题样式（和主页一致） */
        h2 {
            color: #2d3748;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid #e8e8e8;
            text-align: center; 
        }

        h3 {
            color: #2d3748;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        h4 {
            color: #4a5568;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 1rem 0 0.5rem;
        }

        /* 空数据提示（复用主页样式） */
        .empty-tip {
            padding: 1.5rem;
            text-align: center;
            color: #718096;
            font-size: 1rem;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin: 0.5rem 0;
        }

        .empty-api-tip {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 300px;
            gap: 0.6rem;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }

        .empty-api-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #ebf4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.4rem;
        }

        .empty-api-icon i {
            font-size: 2rem;
            color: #4299e1;
        }

        .empty-api-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #2d3748;
        }

        .empty-api-desc {
            font-size: 0.9rem;
            color: #a0aec0;
            max-width: 280px;
            text-align: center;
            line-height: 1.5;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 接口列表样式 */
        ul.api-list-ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        /* 列表项样式：贴近参数列表 / BodyNodeForm 的轻量行式风格 */
        li.api-list-li {
            position: relative;
            padding: 0.45rem 0.4rem;
            border: none;
            border-radius: 6px;
            margin-bottom: 0;
            background-color: transparent;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
        }

        /* 主文字样式（高亮） */
        .method{
            font-weight: 600; 
            font-size: 0.9rem; 
            margin-right: 8px; /* 和副文字留间距 */
            min-width: 70px;
            text-align: center;
        }
        /*url内method*/
        .methodValue{
            font-weight: 600; /* 加粗 */
            font-size: 1.1rem; 
            margin-right: 8px; /* 和副文字留间距 */
            min-width: 70px;
            max-height: 200px;
            text-align: center;
            padding : 0.6rem 1.3rem; /* 增加内边距*/
            border-radius : 4px; /* 圆角*/
            cursor: pointer; /* 鼠标指针 */
             /* 过渡效果 */
             transition: all 0.2s ease;
        }
        .methodValue:hover {
            opacity: 0.8;
        }

        

        .option-list {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: none; /* 默认隐藏 */
            transition: all 0.2s ease;
        }
        .option-item {
            font-weight: 600; /* 加粗 */
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .option-item:hover {
            background-color: #f5f7fa;
        }

        /* 副文字样式（弱化） */
        .name{
            font-weight: 300; /* 常规粗细 */
            color: #718096; /* 浅灰色 */
            font-size: 1.1rem; 
            flex: 1;
        }

        .status-indicator {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            flex-shrink: 0;
            z-index: 1;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-tooltip {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 8px);
            transform: translateX(-50%);
            padding: 0.28rem 0.55rem;
            border-radius: 6px;
            background: rgba(45, 55, 72, 0.96);
            color: #ffffff;
            font-size: 0.78rem;
            line-height: 1;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.12s ease, visibility 0.12s ease;
            z-index: 5;
        }

        .status-indicator:hover .status-tooltip {
            opacity: 1;
            visibility: visible;
        }

        .more-menu-container {
            position: relative;
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        @media (hover: hover) and (pointer: fine) {
            .api-list-li .more-menu-container {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transform: translateX(6px);
                transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
            }

            .api-list-li:hover .more-menu-container,
            .api-list-li:focus-within .more-menu-container,
            .more-menu-container.is-open {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transform: translateX(0);
                transition-delay: 0s;
            }
        }

        @media (hover: none) {
            .more-menu-container {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transform: translateX(0);
            }
        }

        .more-menu-trigger {
            border: none;
            background: transparent;
            color: #a0aec0;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .more-menu-trigger:hover {
            background-color: #edf2f7;
            color: #4a5568;
        }

        .detail-option-list {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            display: none;
            z-index: 2000;
            min-width: 126px;
            width: max-content;
            padding: 0.25rem 0;
            background-color: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        }

        .more-menu-container.is-open .detail-option-list {
            display: block;
        }

        .detail-option-item {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0.55rem 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-weight: 500;
            color: #2d3748;
            text-align: left;
            white-space: nowrap;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .detail-option-item:hover {
            background-color: #f5f7fa;
        }

        .detail-option-item.danger {
            color: #e53e3e;
        }

        .detail-option-item.danger:hover {
            background-color: #fff5f5;
        }

        .detail-option-item .menu-icon {
            width: 1rem;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .detail-option-item .menu-icon svg {
            width: 1rem;
            height: 1rem;
        }

        .rename-modal-backdrop {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.45);
            z-index: 10000;
        }

        .rename-modal-backdrop.is-open {
            display: flex;
        }

        .rename-modal {
            width: min(92vw, 440px);
            padding: 1.25rem;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
        }

        .rename-modal h3 {
            margin-bottom: 1rem;
            color: #1f2937;
            font-size: 1.1rem;
        }

        .rename-modal label {
            display: block;
            margin-bottom: 0.45rem;
            color: #4b5563;
            font-size: 0.92rem;
        }

        .rename-modal input {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
        }

        .rename-modal input:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .btn-secondary,
        .btn-primary {
            border: none;
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #64748b;
        }

        .btn-primary {
            background: #4299e1;
            color: #ffffff;
        }

        .confirm-message {
            color: #4a5568;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .btn-danger {
            background: #e53e3e !important;
        }
        .btn-danger:hover {
            background: #c53030 !important;
        }

        .add-api-btn {
            padding: 0.45rem 0.4rem;
            border: none;
            border-radius: 6px;
            background-color: transparent;
            color: #64748b;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            margin-top: 0.4rem;
            font-size: 0.98rem;
            font-weight: 500;
        }
        .add-api-btn:hover {
            color: #4299e1;
            background-color: #edf0f2;
        }
        .add-api-btn i {
            font-size: 1.05rem;
        }

        /* 列表项hover效果 */
        li.api-list-li:hover {
            background-color: #edf0f2;
        }
        
        /* 激活状态样式 */
        li.api-list-li.active {
            background-color: #edf0f2;
        }

        /* 最后一个列表项去掉下边框 */
        li.api-list-li:last-child {
            margin-bottom: 0;
        }

        /* ========== Tree Table Styles ========== */
        .tree-table-ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .tree-children-ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 5000px;
            overflow: visible;
            transition: max-height 0.3s ease, opacity 0.25s ease;
            opacity: 1;
        }

        .tree-children-ul.collapsed {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, opacity 0.2s ease;
        }

        /* Category row */
        .tree-category-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .tree-category-row:hover {
            background-color: #edf0f2;
        }

        .tree-arrow {
            flex-shrink: 0;
            width: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #718096;
            font-size: 0.75rem;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .tree-arrow:hover {
            color: #4299e1;
        }

        .tree-folder {
            flex-shrink: 0;
            width: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #718096;
            font-size: 0.95rem;
        }

        .tree-category-name {
            flex: 1;
            font-weight: 500;
            color:#777777;
            font-size: 1rem;
        }

        /* API row (within tree) */
        .tree-api-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: relative;
        }

        .tree-api-row:hover {
            background-color: #edf0f2;
        }

        .tree-api-row.active {
            background-color: #edf0f2;
        }

        .tree-api-row .method {
            font-weight: 600;
            font-size: 0.9rem;
            min-width: 52px;
            text-align: center;
            flex-shrink: 0;
        }

        .tree-api-row .name {
            flex: 1;
            font-weight: 300;
            color: #718096;
            font-size: 1.05rem;
        }

        /* More menu within tree */
        .tree-menu-container {
            position: relative;
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        @media (hover: hover) and (pointer: fine) {
            .tree-category-row .tree-menu-container,
            .tree-api-row .tree-menu-container {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transform: translateX(6px);
                transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
            }

            .tree-category-row:hover .tree-menu-container,
            .tree-category-row:focus-within .tree-menu-container,
            .tree-menu-container.is-open,
            .tree-api-row:hover .tree-menu-container,
            .tree-api-row:focus-within .tree-menu-container {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transform: translateX(0);
                transition-delay: 0s;
            }
        }

        @media (hover: none) {
            .tree-menu-container {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transform: translateX(0);
            }
        }

        .tree-option-list {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            display: none;
            z-index: 2000;
            min-width: 126px;
            width: max-content;
            padding: 0.25rem 0;
            background-color: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        }

        .tree-menu-container.is-open .tree-option-list {
            display: block;
        }

        .tree-option-item {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0.55rem 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-weight: 500;
            color: #2d3748;
            text-align: left;
            white-space: nowrap;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .tree-option-item:hover {
            background-color: #f5f7fa;
        }

        .tree-option-item.danger {
            color: #e53e3e;
        }

        .tree-option-item.danger:hover {
            background-color: #fff5f5;
        }

        .tree-option-item .menu-icon {
            width: 1rem;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tree-option-item .menu-icon svg {
            width: 1rem;
            height: 1rem;
        }

        .add-category-btn {
            padding: 0.45rem 0.4rem;
            border: none;
            border-radius: 6px;
            background-color: transparent;
            color: #64748b;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            margin-top: 0.2rem;
            font-size: 0.98rem;
            font-weight: 500;
        }

        .add-category-btn:hover {
            color: #f6ad55;
            background-color: #fffbeb;
        }

        .add-category-btn i {
            font-size: 1.05rem;
        }
        /* ========== End Tree Table Styles ========== */

        /* 接口名称样式 */
        .api-name {
            font-weight: 500;
            color: #2d3748;
            font-size: 1rem;
        }

        /* 错误提示样式（复用主页） */
        .error-tip {
            padding: 1.2rem;
            color: #e53e3e;
            background-color: #fef2f2;
            border-radius: 8px;
            margin: 1rem 0;
            border: 1px solid #fee2e2;
        }

        /* 测试窗口标签容器 */
        .test-tab-container {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid #e8e8e8;
            /* padding-bottom: 0.5rem; */
        }

        /* 测试窗口标签样式 */
        .test-tab {
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #718096;
            font-size: 1rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
        }

        /* 激活的标签样式 */
        .test-tab.active {
            border-radius: 3px;
            color: #4299e1;
            border-bottom-color: #4299e1;
        }

        .test-tab:hover:not(.active) {
            color: #4299e1;
            background-color: #f0f7ff;
        }

        /* 调试窗口样式 */
        .debug-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* 请求行样式 */
        .request-line {
            position: relative;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        /* URL输入框样式 */
        .url {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            font-size: 1rem;
            color: #2d3748;
            outline: none;
            transition: border-color 0.2s ease;
            min-width: 200px;
        }

        .url:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.2);
        }

        /* 发送按钮样式 */
        .submit-btn {
            padding: 0.8rem 1.5rem;
            background-color: #4299e1;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .submit-btn:hover {
            background-color: #3182ce;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
        .request-info {
            display: flex;
            gap: 0.5rem;
            /* padding-bottom: 0.5rem; */
            margin: 1rem 0;
            border-bottom: 1px solid #e8e8e8;
        }

        /* 响应区域样式 */
        .response-container {
            position: relative;
            border-top: 1px solid #e8e8e8;
            display: block;
            gap: 0.5rem;
            /* margin-top: 5rem; */
            padding-top: 0.5rem;
        }

        .resize-handle {
            position: absolute;
            top: -5px;
            left: 0;
            right: 0;
            height: 10px;
            cursor: row-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            z-index: 5;
        }

        .resize-handle::before {
            content: '';
            width: 2.5rem;
            height: 3px;
            border-radius: 2px;
            background-color: #cbd5e0;
            transition: width 0.15s ease, background-color 0.15s ease;
        }

        .resize-handle:hover::before {
