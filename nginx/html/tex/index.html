<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon .ico" type="image/x-icon">
    <title>TexApi-登录</title>
    <!-- CDN 引入 axios，浏览器端无需 import -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- CDN 引入 anime.js，用于动画效果 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 页面整体布局 — 高级渐变背景 */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f0f8 0%, #dce8f4 25%, #e3edf7 50%, #d6e6f5 75%, #eaf3fb 100%);
            background-size: 400% 400%;
            animation: bgShift 20s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        /* 背景渐变动画 */
        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }

        /* 微妙网格纹理覆盖层 */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(66, 153, 225, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(66, 153, 225, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* 背景加深覆盖层 — 由 JS 通过 --bg-deepen 控制透明度 */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(20, 40, 70, 1);
            opacity: var(--bg-deepen, 0);
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.3s ease;
        }

        /* 浮动几何装饰元素容器 */
        .bg-ornament {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
        }

        /* 登录表单容器 — 玻璃拟态 */
        #loginForm {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow:
                0 4px 24px rgba(66, 153, 225, 0.08),
                0 20px 60px rgba(66, 153, 225, 0.06);
            text-align: center;
            position: relative;
            z-index: 2;
            transition: box-shadow 0.4s ease;
        }

        #loginForm:hover {
            box-shadow:
                0 4px 28px rgba(66, 153, 225, 0.12),
                0 24px 72px rgba(66, 153, 225, 0.10);
        }

        /* 标题样式 */
        #loginForm h1 {
            color: #2d3748; /* 深灰色标题，不刺眼 */
            font-size: 2rem;
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
        }

        /* 输入框样式 */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.9rem 1rem;
            margin-bottom: 1.2rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            outline: none;
        }

        /* 输入框聚焦效果 */
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #4299e1; /* 柔和的蓝色聚焦边框 */
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        /* 输入框错误状态 */
        input.error {
            border-color: #dc2626;
        }
        input.error:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        /* 错误提示文字 */
        .error-text {
            display: block;
            color: #dc2626;
            font-size: 14px;
            margin-top: -8px;
            margin-bottom: 12px;
        }

        /* 输入框占位符样式 */
        input::placeholder {
            color: #a0aec0;
            font-size: 0.95rem;
        }

        /* 登录按钮样式 */
        #loginBtn {
            width: 100%;
            padding: 0.9rem;
            background-color: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 0.5rem;
        }

        /* 按钮悬停效果 */
        #loginBtn:hover {
            background-color: #3182ce;
        }

        /* 按钮禁用状态（可选） */
        #loginBtn:disabled {
            background-color: #90cdf4;
            cursor: not-allowed;
        }

        .register-link {
            display: inline-block;
            margin-top: 1rem;
            color: #4299e1;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .register-link:hover {
            color: #3182ce;
            text-decoration: none;
            transform: translateY(-1px);
        }

        
        /* ========== 鼠标跟随光晕凹陷层 ========== */
        .mouse-glow {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            /* 中心稍深、向外渐变消失的凹陷感 */
            background: radial-gradient(circle at center,
                    rgba(30, 60, 100, 0.10) 0%,
                    rgba(40, 80, 130, 0.06) 25%,
                    rgba(66, 120, 180, 0.03) 50%,
                    transparent 70%);
            transform: translate(-50%, -50%);
            will-change: left, top;
            transition: left 0.15s ease-out, top 0.15s ease-out;
        }

        /* 响应式适配小屏幕 */
        @media (max-width: 480px) {
            #loginForm {
                padding: 1.8rem;
                margin: 0 1rem;
            }

            #loginForm h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- 背景浮动几何装饰 -->
    <div class="bg-ornament" id="ornament1"></div>
    <div class="bg-ornament" id="ornament2"></div>
    <div class="bg-ornament" id="ornament3"></div>
    <div class="bg-ornament" id="ornament4"></div>

    <!-- 鼠标跟随光晕凹陷层 -->
    <div class="mouse-glow" id="mouseGlow"></div>

    <form id="loginForm" action="">
        <h1>TexApi</h1><br>

        
        <input type="text" id="userName" placeholder="userName"><br>
        
        <input type="password" id="password" placeholder="password">
        <span class="error-text" id="loginError"></span><br>

        <button type="button" id="loginBtn">登录</button>
        <br>
        <a class="register-link" href="pages/registry/registry.html">没有账号？去注册</a>
    </form>
    <script src="components/dotWaveBackground.js"></script>
    <script src="index.js"></script>
</body>
</html>
