# ================================================================
# TexApi — Docker Compose 部署配置
# 部署步骤：
#   1. cp .env.example .env
#   2. 编辑 .env，设置你的数据库和 Redis 密码
#   3. docker compose up -d
#   4. 访问 http://localhost
# ================================================================

services:
  # ========== Java 后端 API ==========
  server:
    build:
      context: .
    environment:
      - TEX_DATASOURCE_HOST=db
      - TEX_DATASOURCE_PORT=3306
      - TEX_USERNAME=root
      - TEX_PASSWORD=${DB_PASSWORD}
      - TEX_REDIS_HOST=redis
      - TEX_REDIS_PORT=6379
      - TEX_REDIS_PASSWORD=${REDIS_PASSWORD}
      - TEX_REDIS_DATABASE=9
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ========== MySQL ==========
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: tex_api
    volumes:
      - db-data:/var/lib/mysql
      - ./src/main/resources/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

  # ========== Nginx（静态资源 + 反向代理）==========
  proxy:
    image: nginx:1.26-alpine
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  db-data:
  redis-data:

